name: CI

# Every push and pull request builds Linux GCC, Linux Clang and Windows MSVC
# (Debug and Release), the Godot host on Linux and Windows, and the Unreal
# plugin's engine-free parts on Linux and Windows. Docs-only
# changes skip it, superseded runs are cancelled, and compiles (ccache) and the
# FetchContent downloads are cached; caches are written from main, which pull
# requests can read.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - docs/**
      - LICENSE*
  pull_request:
    paths-ignore:
      - '**.md'
      - docs/**
      - LICENSE*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache

jobs:
  build:
    name: ${{ matrix.name }} (${{ matrix.preset }})
    strategy:
      fail-fast: false
      matrix:
        preset: [dev, release]
        name: [Linux GCC, Linux Clang, Windows MSVC]
        include:
          - name: Linux GCC
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
          - name: Linux Clang
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
          - name: Windows MSVC
            os: windows-2022
            cc: cl
            cxx: cl
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install Ninja and ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libasound2-dev
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: build-${{ matrix.os }}-${{ matrix.cc }}-${{ matrix.preset }}
          max-size: 500M
          save: ${{ github.event_name != 'pull_request' }}
      - uses: actions/cache@v4
        with:
          # The downloaded sources only; the dependency builds come from ccache.
          path: |
            build/${{ matrix.preset }}/_deps
            !build/${{ matrix.preset }}/_deps/*-build
          key: fetchcontent-${{ matrix.preset }}-${{ matrix.os }}-${{ hashFiles('cmake/ZtripDependencies.cmake', 'tests/CMakeLists.txt') }}
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DFETCHCONTENT_UPDATES_DISCONNECTED=ON
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  godot:
    name: Godot host (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-2022
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Set the compiler
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "CC=cl" >> "$GITHUB_ENV"; echo "CXX=cl" >> "$GITHUB_ENV"
          else
            echo "CC=gcc" >> "$GITHUB_ENV"; echo "CXX=g++" >> "$GITHUB_ENV"
          fi
      - name: Install Ninja and ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libasound2-dev
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: godot-${{ matrix.os }}
          max-size: 500M
          save: ${{ github.event_name != 'pull_request' }}
      - uses: actions/cache@v4
        with:
          # The downloaded sources only; the dependency builds come from ccache.
          path: |
            build/godot/_deps
            !build/godot/_deps/*-build
          key: fetchcontent-godot-${{ matrix.os }}-${{ hashFiles('cmake/ZtripDependencies.cmake', 'tests/CMakeLists.txt', 'hosts/godot/CMakeLists.txt') }}
      - name: Configure
        run: cmake --preset godot -DFETCHCONTENT_UPDATES_DISCONNECTED=ON
      - name: Build
        run: cmake --build --preset godot
      - name: Test core
        run: ctest --preset godot
      - name: Test in Godot
        run: |
          # The oldest supported Godot and the newest one tested.
          for version in 4.5.1 4.7.2; do
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              zip="Godot_v${version}-stable_win64.exe.zip"
              exe="Godot_v${version}-stable_win64_console.exe"
            else
              zip="Godot_v${version}-stable_linux.x86_64.zip"
              exe="Godot_v${version}-stable_linux.x86_64"
            fi
            mkdir -p "$RUNNER_TEMP/godot-$version"
            curl -sSfL -o "$RUNNER_TEMP/$zip" "https://github.com/godotengine/godot/releases/download/${version}-stable/$zip"
            unzip -q -o "$RUNNER_TEMP/$zip" -d "$RUNNER_TEMP/godot-$version"
            godot="$RUNNER_TEMP/godot-$version/$exe"
            rm -rf hosts/godot/project/.godot
            # Godot 4.5.1 can crash on exit after a first import with any
            # GDExtension loaded; the import itself completes, so check that.
            "$godot" --headless --path hosts/godot/project --import || true
            test -f hosts/godot/project/.godot/extension_list.cfg
            "$godot" --headless --path hosts/godot/project -s res://tests/test_host.gd
          done
      - name: Upload the addon
        uses: actions/upload-artifact@v4
        with:
          name: ztrip-godot-${{ runner.os }}
          retention-days: 7
          path: |
            hosts/godot/project
            !hosts/godot/project/.godot

  unreal:
    # No Unreal Engine on free runners: this stages the plugin, builds its
    # engine-free part the way UnrealBuildTool would (hosts/unreal/check),
    # runs a song through it, and runs the module rules (*.Build.cs) against
    # a stand-in for UnrealBuildTool.
    name: Unreal plugin, engine-free (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux Clang
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
          - name: Windows MSVC
            os: windows-2022
            cc: cl
            cxx: cl
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install Ninja and ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libasound2-dev
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: unreal-${{ matrix.os }}
          max-size: 200M
          save: ${{ github.event_name != 'pull_request' }}
      - uses: actions/cache@v4
        with:
          path: |
            build/release/_deps
            !build/release/_deps/*-build
          key: fetchcontent-release-${{ matrix.os }}-${{ hashFiles('cmake/ZtripDependencies.cmake', 'tests/CMakeLists.txt') }}
      - name: Stage the plugin
        run: |
          cmake --preset release -DFETCHCONTENT_UPDATES_DISCONNECTED=ON
          cmake --build --preset release --target ztrip_unreal_plugin
      - name: Build the engine-free part
        run: |
          cmake -S hosts/unreal/check -B build/unreal-check -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DZTRIP_UNREAL_PLUGIN=build/release/unreal/Ztrip
          cmake --build build/unreal-check
      - name: Run a song through it
        run: build/unreal-check/ztrip_unreal_check hosts/godot/project/demo/stage.mgraph.json
      - name: Check the module rules
        run: dotnet run --project hosts/unreal/check/rules -p:PluginDir="$(pwd -W 2>/dev/null || pwd)/build/release/unreal/Ztrip"
      - name: Upload the plugin
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ztrip-unreal-plugin
          retention-days: 7
          path: build/release/unreal/Ztrip
