name: CI

# Sized for the free private-repo Actions quota, where Windows minutes count
# double (see docs/DECISIONS.md):
# - pull requests that aren't drafts: one Linux GCC release build and tests;
# - pushes to main: that, plus the Godot host on Linux;
# - the weekly schedule and manual dispatch (Actions > CI > Run workflow):
#   everything, adding Windows MSVC and the Godot host on Windows.
# Docs-only changes skip it all. Compiles (ccache) and the FetchContent
# downloads are cached; caches are written from main, which pull requests can read.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - docs/**
      - LICENSE*
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - docs/**
      - LICENSE*
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache

jobs:
  build:
    name: ${{ matrix.name }} (release)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        # Windows only on the full runs (schedule, dispatch).
        include: ${{ fromJSON(contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) && '[{"name":"Linux GCC","os":"ubuntu-24.04","cc":"gcc","cxx":"g++"},{"name":"Windows MSVC","os":"windows-2022","cc":"cl","cxx":"cl"}]' || '[{"name":"Linux GCC","os":"ubuntu-24.04","cc":"gcc","cxx":"g++"}]') }}
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install Ninja
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: build-${{ matrix.os }}
          max-size: 500M
          save: ${{ github.event_name != 'pull_request' }}
      - uses: actions/cache@v4
        with:
          # The downloaded sources only; the dependency builds come from ccache.
          path: |
            build/release/_deps
            !build/release/_deps/*-build
          key: fetchcontent-release-${{ matrix.os }}-${{ hashFiles('cmake/ZtripDependencies.cmake', 'tests/CMakeLists.txt') }}
      - name: Configure
        run: cmake --preset release -DFETCHCONTENT_UPDATES_DISCONNECTED=ON
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: ctest --preset release

  godot:
    name: Godot host (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        # Linux on every push to main; Windows only on the full runs.
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-24.04"]' || '["ubuntu-24.04","windows-2022"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Set the compiler
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "CC=cl" >> "$GITHUB_ENV"; echo "CXX=cl" >> "$GITHUB_ENV"
          else
            echo "CC=gcc" >> "$GITHUB_ENV"; echo "CXX=g++" >> "$GITHUB_ENV"
          fi
      - name: Install Ninja
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: godot-${{ matrix.os }}
          max-size: 500M
      - uses: actions/cache@v4
        with:
          # The downloaded sources only; the dependency builds come from ccache.
          path: |
            build/godot/_deps
            !build/godot/_deps/*-build
          key: fetchcontent-godot-${{ matrix.os }}-${{ hashFiles('cmake/ZtripDependencies.cmake', 'tests/CMakeLists.txt', 'hosts/godot/CMakeLists.txt') }}
      - name: Configure
        run: cmake --preset godot -DFETCHCONTENT_UPDATES_DISCONNECTED=ON
      - name: Build
        run: cmake --build --preset godot
      - name: Test core
        run: ctest --preset godot
      - name: Test in Godot
        run: |
          # The oldest supported Godot and the newest one tested.
          for version in 4.5.1 4.7.2; do
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              zip="Godot_v${version}-stable_win64.exe.zip"
              exe="Godot_v${version}-stable_win64_console.exe"
            else
              zip="Godot_v${version}-stable_linux.x86_64.zip"
              exe="Godot_v${version}-stable_linux.x86_64"
            fi
            mkdir -p "$RUNNER_TEMP/godot-$version"
            curl -sSfL -o "$RUNNER_TEMP/$zip" "https://github.com/godotengine/godot/releases/download/${version}-stable/$zip"
            unzip -q -o "$RUNNER_TEMP/$zip" -d "$RUNNER_TEMP/godot-$version"
            godot="$RUNNER_TEMP/godot-$version/$exe"
            rm -rf hosts/godot/project/.godot
            # Godot 4.5.1 can crash on exit after a first import with any
            # GDExtension loaded; the import itself completes, so check that.
            "$godot" --headless --path hosts/godot/project --import || true
            test -f hosts/godot/project/.godot/extension_list.cfg
            "$godot" --headless --path hosts/godot/project -s res://tests/test_host.gd
          done
      - name: Upload the addon
        uses: actions/upload-artifact@v4
        with:
          name: ztrip-godot-${{ runner.os }}
          retention-days: 7
          path: |
            hosts/godot/project
            !hosts/godot/project/.godot
